name: publish
# Publishes loopward to npm when a version tag (vX.Y.Z) is pushed. The token lives only in the
# NPM_TOKEN repo secret (Automation token — bypasses 2FA for CI). prepack builds dist automatically.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build + pack, do NOT publish)"
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: install dev deps (typescript, for the prepack build)
        run: npm install --no-audit --no-fund
      - name: offline self-checks (gate before publish)
        run: npm test
      - name: validate npm auth (whoami — proves the NPM_TOKEN secret works)
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG  package.json=$PKG"
          [ "$TAG" = "$PKG" ] || { echo "::error::tag v$TAG does not match package.json version $PKG — bump one to match"; exit 1; }
      - name: publish to npm
        run: npm publish ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

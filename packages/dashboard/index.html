<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Loopward: test your agent's routing</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --line: #e5e8ec; --ink: #171b22; --muted: #616b7a;
    --accent: #0d9488; --accent-soft: #0d948815; --shadow: 0 1px 2px #0000000d, 0 8px 24px #0b0f1408;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0b0e14; --panel:#111621; --line:#212836; --ink:#e6edf3; --muted:#8b95a5; --accent:#5eead4; --accent-soft:#5eead41a; --shadow:0 1px 2px #0000, 0 8px 30px #0006; }
  }
  :root[data-theme="light"] { --bg:#f6f7f9; --panel:#fff; --line:#e5e8ec; --ink:#171b22; --muted:#616b7a; --accent:#0d9488; --accent-soft:#0d948815; --shadow:0 1px 2px #0000000d, 0 8px 24px #0b0f1408; }
  :root[data-theme="dark"]  { --bg:#0b0e14; --panel:#111621; --line:#212836; --ink:#e6edf3; --muted:#8b95a5; --accent:#5eead4; --accent-soft:#5eead41a; --shadow:0 1px 2px #0000, 0 8px 30px #0006; }

  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); line-height:1.6; -webkit-font-smoothing:antialiased; }
  .wrap { max-width: 1040px; margin:0 auto; padding: 40px 24px 80px; }
  a { color: var(--accent); }
  h1,h2 { letter-spacing:-0.02em; text-wrap:balance; }
  .mono { font-family:var(--mono); }

  header.top { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:8px; }
  .brand { display:inline-flex; align-items:center; gap:8px; font-family:var(--mono); font-weight:600; font-size:14px; letter-spacing:.02em; color:var(--accent); }
  .brand .mark { width:24px; height:24px; flex:none; }
  h1 { font-size: clamp(28px, 4.5vw, 42px); margin:.15em 0 .1em; }
  .tagline { color:var(--muted); font-size:17px; max-width:62ch; margin:0 0 4px; }
  .pill { display:inline-block; font-size:12px; font-family:var(--mono); color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:3px 10px; }
  .btns { display:flex; gap:8px; flex:none; }
  .tbtn { border:1px solid var(--line); background:var(--panel); color:var(--muted); border-radius:8px; padding:6px 10px; font-family:var(--mono); font-size:12px; cursor:pointer; white-space:nowrap; }

  .hero { display:grid; grid-template-columns: auto 1fr; gap:20px 28px; align-items:center; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:24px 28px; box-shadow:var(--shadow); margin:28px 0 12px; }
  .hero .big { font-family:var(--mono); font-weight:600; font-size:clamp(36px,7vw,58px); line-height:1; letter-spacing:-.03em; white-space:nowrap; }
  .hero .big .g { color:#16a34a; } .hero .big .r { color:#dc2626; } .hero .big .s { color:var(--muted); font-weight:400; }
  .hero .cap { color:var(--muted); font-size:15px; }
  .hero .cap b { color:var(--ink); font-weight:600; }

  section { margin-top:44px; }
  h2 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:14px; margin:0 0 16px; max-width:72ch; }

  .prose p { max-width:72ch; margin:0 0 12px; font-size:15px; }
  .prose p:last-child { margin-bottom:0; }
  .pills { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }

  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(232px,1fr)); gap:14px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; box-shadow:var(--shadow); }
  .card .tag { display:block; font-family:var(--mono); font-size:10.5px; color:var(--accent); text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px; }
  .card h3 { margin:0 0 6px; font-size:14px; }
  .card p { margin:0; color:var(--muted); font-size:13.5px; }
  .card .k { font-family:var(--mono); color:var(--accent); font-variant-numeric:tabular-nums; }

  .pre { overflow-x:auto; border:1px solid var(--line); border-radius:12px; background:var(--panel); box-shadow:var(--shadow); padding:16px 18px; margin:0 0 10px; }
  .pre code { font-family:var(--mono); font-size:12.5px; color:var(--ink); white-space:pre; display:block; line-height:1.55; }
  .pre .c { color:var(--muted); }
  .usecap { color:var(--muted); font-size:13px; margin:0 0 20px; max-width:72ch; }

  .cmds { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .cmd { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; box-shadow:var(--shadow); }
  .cmd .tag { font-family:var(--mono); font-size:10.5px; color:var(--accent); text-transform:uppercase; letter-spacing:.06em; }
  .cmd code { font-family:var(--mono); font-size:12px; color:var(--ink); background:var(--accent-soft); padding:9px 11px; border-radius:8px; display:block; overflow-x:auto; white-space:nowrap; margin:8px 0; }
  .cmd .d { color:var(--muted); font-size:13.5px; margin:0; }

  .scroll { overflow-x:auto; border:1px solid var(--line); border-radius:14px; background:var(--panel); box-shadow:var(--shadow); }
  table.heat { border-collapse:collapse; width:100%; font-size:13px; }
  table.heat th, table.heat td { padding:0; text-align:center; }
  table.heat thead th { position:sticky; top:0; background:var(--panel); color:var(--muted); font-weight:500; font-family:var(--mono); font-size:11px; padding:12px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  table.heat thead th.model { text-align:left; padding-left:16px; }
  .mcell { display:flex; align-items:center; gap:8px; padding:8px 16px; text-align:left; white-space:nowrap; }
  .dot { width:8px; height:8px; border-radius:50%; flex:none; }
  .mname { font-family:var(--mono); font-size:12.5px; }
  .vend { color:var(--muted); font-size:10.5px; font-family:var(--mono); }
  td.cell { color:#fff; font-family:var(--mono); font-variant-numeric:tabular-nums; font-weight:600; font-size:12.5px; min-width:78px; height:40px; border:2px solid var(--panel); border-radius:6px; }
  td.rowlab { border-top:1px solid var(--line); }
  .colhead { display:inline-flex; align-items:center; gap:4px; justify-content:center; }
  .q { display:inline-flex; align-items:center; justify-content:center; width:14px; height:14px; border:1px solid var(--line); border-radius:50%; font-size:9px; font-weight:600; color:var(--muted); cursor:help; position:relative; }
  .q::after { content:attr(data-tip); position:absolute; top:150%; left:50%; transform:translateX(-50%); width:210px; background:var(--ink); color:var(--bg); padding:9px 11px; border-radius:9px; font-size:11.5px; font-weight:400; line-height:1.5; font-family:var(--sans); letter-spacing:0; text-transform:none; text-align:left; white-space:normal; opacity:0; pointer-events:none; transition:opacity .12s; z-index:20; box-shadow:0 6px 20px #0006; }
  .q:hover::after, .q:focus::after { opacity:1; }

  .bars { display:grid; gap:8px; }
  .barrow { display:grid; grid-template-columns:150px 1fr; align-items:center; gap:12px; font-size:13px; }
  .barrow .lab { font-family:var(--mono); font-size:11.5px; color:var(--muted); text-align:right; }
  .track { position:relative; height:26px; background:var(--accent-soft); border-radius:6px; display:flex; align-items:center; }
  .track .fill { height:100%; border-radius:6px; opacity:.85; }
  .track .val { position:absolute; right:8px; font-family:var(--mono); font-size:11.5px; }

  .two { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  .divider { margin:52px 0 0; border-top:1px solid var(--line); padding-top:8px; }
  @media (max-width:720px){ .hero{grid-template-columns:1fr;} .two,.cmds{grid-template-columns:1fr;} .barrow{grid-template-columns:120px 1fr;} }

  footer { margin-top:56px; padding-top:24px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }
  footer p { max-width:74ch; }
  footer code { font-family:var(--mono); background:var(--accent-soft); padding:2px 6px; border-radius:5px; color:var(--ink); }
  .caveat { background:var(--accent-soft); border:1px solid var(--line); border-radius:12px; padding:14px 16px; font-size:13px; color:var(--muted); margin-top:14px; max-width:74ch; }
</style>
</head>

function sev(v){ const t=Math.max(0,Math.min(100,v))/100; const hue = 145 - 145*t; const l = 34 + 6*Math.sin(t*Math.PI); return `hsl(${hue.toFixed(0)} 62% ${l.toFixed(0)}%)`; }

function heat(){
  const t=document.getElementById("heat"); const A=DATA.attacks; const AL=T[lang].attack;
  const esc=(s)=>s.replace(/&/g,"&amp;").replace(/'/g,"&#39;").replace(/</g,"&lt;");
  let h="<thead><tr><th class='model'>model</th>"+A.map(a=>`<th><span class='colhead'>${AL[a].l}<span class='q' tabindex='0' data-tip='${esc(AL[a].d)}'>?</span></span></th>`).join("")+"</tr></thead><tbody>";
  for(const m of DATA.models){
    h+=`<tr><td class='rowlab'><div class='mcell'><span class='dot' style='background:${VENDOR_COLOR[m.vendor]||"#888"}'></span><span><span class='mname'>${m.name}</span><br><span class='vend'>${m.vendor}</span></span></div></td>`;
    for(const a of A){ const v=m.deltas[a]; h+=`<td class='cell' style='background:${sev(v)}' title='${m.name}, ${AL[a].l}: ${v}'>+${v}</td>`; }
    h+="</tr>";
  }
  t.innerHTML=h+"</tbody>";
}

function variant(){
  const rows=DATA.variant.rows.map(([a,s,sc])=>[a,+(sc-s).toFixed(1)]).sort((x,y)=>x[1]-y[1]);
  const max=Math.max(...rows.map(r=>Math.abs(r[1])),1);
  document.getElementById("variant").innerHTML=rows.map(([a,d])=>{ const w=Math.abs(d)/max*100; const col=d>=0?"#16a34a":"#dc2626";
    return `<div class='barrow'><div class='lab'>${a}</div><div class='track'><div class='fill' style='width:${w}%;background:${col}'></div><span class='val'>${d>0?"+":""}${d}</span></div></div>`; }).join("");
}
function multi(){
  const m=DATA.multistep; const L=T[lang].multi;
  const rows=[[L[0],100,"#16a34a"],[L[1],m.success,"#0d9488"],[L[2],m.premature_stop,"#dc2626"],[L[3],m.over_run,"#dc2626"]];
  document.getElementById("multi").innerHTML=rows.map(([l,v,c])=>`<div class='barrow'><div class='lab'>${l}</div><div class='track'><div class='fill' style='width:${v}%;background:${c}'></div><span class='val'>${v}%</span></div></div>`).join("");
}
function render(){
  const d=T[lang];
  for(const id of ["h1","tag","to","cap","whh","whp","feh","fes","useh","uses","usecap","s1h","s1s","s2h","s3ah","s3as","s3bh","s3bs","s3bc","fp","fc"])
    document.getElementById("t-"+id).innerHTML = d[id];
  document.getElementById("toolcode").textContent = TOOLJSON;
  document.getElementById("lang").textContent = d.lang;
  document.getElementById("meta").textContent = DATA.generated;
  document.documentElement.lang = lang;
  pills(); feats(); cmds(); heat(); cards(); variant(); multi();
}
render();

document.getElementById("lang").onclick=()=>{ lang = lang==="en"?"zh":"en"; render(); };
const root=document.documentElement;
document.getElementById("theme").onclick=()=>{ const cur=root.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"); root.setAttribute("data-theme", cur==="dark"?"light":"dark"); };
</script>
</body>
